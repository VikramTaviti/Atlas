[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "atlas-agent-runtime"
version = "0.1.0"
description = "Adaptive Agent Execution & Reliability Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4"]
observability = ["opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
gemini = ["google-genai>=1,<2"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "types-jsonschema>=4.23,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: optional tests requiring external services or credentials"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
